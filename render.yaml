# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Fastify API + managed Postgres + Key Value. The player-facing Next.js app
# is on Netlify; set CORS_ORIGIN to that origin after the first Netlify deploy.
# GEMINI_API_KEY and COHERE_API_KEY are filled in the Render Dashboard.
#
# Hobby / free tier: the API sleeps after 15 minutes idle (cold start ~1 min),
# free Postgres expires after 30 days, and free Key Value has no persistence
# (session keys vanish if the instance restarts). Hobby workspaces cannot
# create preview environments, so this file does not declare `previews`.

projects:
  - name: system-rpg
    environments:
      - name: production
        databases:
          - name: system-db
            plan: free
            region: oregon
            postgresMajorVersion: "17"

        services:
          - type: keyvalue
            name: system-cache
            plan: free
            region: oregon
            # Free Key Value does not persist to disk; volatile-ttl still drops
            # expired session keys first if memory pressure hits.
            maxmemoryPolicy: volatile-ttl
            persistenceMode: off
            ipAllowList: []

          - type: web
            name: system-api
            runtime: node
            plan: free
            region: oregon
            healthCheckPath: /health
            autoDeployTrigger: commit
            # --include=dev is required: NODE_ENV=production would otherwise skip
            # typescript, which the build uses. Runtime migrate uses compiled JS.
            buildCommand: npm ci --include=dev && npm run build -w @system/shared && npm run build -w @system/server
            # Free web instances cannot run pre-deploy commands. Boot migrates
            # and seeds before listen() in apps/server/src/index.ts.
            startCommand: npm run start -w @system/server
            buildFilter:
              paths:
                - apps/server/**
                - packages/shared/**
                - package.json
                - package-lock.json
                - render.yaml
            envVars:
              - key: NODE_ENV
                value: production
              - key: NODE_VERSION
                value: "22"
              - key: HOST
                value: "0.0.0.0"
              - key: DATABASE_URL
                fromDatabase:
                  name: system-db
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: system-cache
                  property: connectionString
              - key: GEMINI_API_KEY
                sync: false
              - key: GEMINI_MODEL
                value: gemini-2.5-flash
              - key: COHERE_API_KEY
                sync: false
              - key: COHERE_MODEL
                value: command-r-08-2024
              - key: LLM_PROVIDER
                value: auto
              - key: SESSION_TTL_SECONDS
                value: "86400"
              - key: STATIC_NODE_RATIO
                value: "0.35"
              - key: COLLISION_THRESHOLD
                value: "0.7"
              # Each unit of fan-out costs two extra model calls per turn.
              - key: PREFETCH_FANOUT
                value: "1"
              # Player site is on Netlify. Set this to that origin after the
              # first Netlify deploy (comma-separated if you keep a Render URL too).
              - key: CORS_ORIGIN
                sync: false
